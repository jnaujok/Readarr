name: 'Lock threads'

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

permissions:
  issues: write
  pull-requests: write

concurrency:
  group: lock-threads

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      # v4 validates github-token length <= 100 and fails on current GITHUB_TOKEN.
      # v6.0.2+ accepts the longer token and runs on Node 24.
      - uses: dessant/lock-threads@v6
        with:
          issue-inactive-days: '90'
          issue-lock-reason: 'resolved'
          process-only: 'issues, prs'
